version: "3.9"

services:
  # Python Full-Stack AI Career Recommendation System & Intelligence Platform
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-path-python-app
    ports:
      - "8000:8000"
      - "3000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./career_path.db:/app/career_path.db
    restart: unless-stopped
