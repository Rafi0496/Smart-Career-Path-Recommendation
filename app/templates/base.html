<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Smart Career Path | AI Career Intelligence Platform{% endblock %}</title>
  
  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS Play CDN with Dark Mode & Custom Palette -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
              950: '#082f49',
            },
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/static/css/styles.css" />

  <!-- Pre-render theme check to prevent flickering -->
  <script>
    try {
      const stored = localStorage.getItem('career_path_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {}
  </script>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 flex flex-col antialiased transition-colors duration-300"
      {% if active_career %}data-career-title="{{ active_career }}"{% endif %}
      {% if user %}data-user-name="{{ user.name }}"{% endif %}>

  <!-- Sticky Top Navigation -->
  <header class="sticky top-0 z-40 w-full border-b border-slate-200/80 dark:border-slate-800/80 bg-white/75 dark:bg-slate-900/80 backdrop-blur-md transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="/" class="flex items-center gap-2.5 group transition-transform duration-200 hover:scale-[1.02]">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-tr from-primary-600 to-emerald-500 text-white shadow-md shadow-primary-500/25">
          <i data-lucide="compass" class="w-5 h-5 transition-transform duration-500 group-hover:rotate-45"></i>
        </div>
        <span class="font-bold text-lg text-slate-800 dark:text-slate-100 tracking-tight">
          Smart Career Path
        </span>
      </a>

      <!-- Center Navigation Links -->
      <nav class="hidden md:flex items-center gap-1.5">
        <a href="/" class="px-3 py-1.5 rounded-lg text-sm font-medium transition {% if active_page == 'home' %}bg-primary-50 dark:bg-primary-950/50 text-primary-700 dark:text-primary-400{% else %}text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800{% endif %}">Home</a>
        <a href="/dashboard" class="px-3 py-1.5 rounded-lg text-sm font-medium transition {% if active_page == 'dashboard' %}bg-primary-50 dark:bg-primary-950/50 text-primary-700 dark:text-primary-400{% else %}text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800{% endif %}">Dashboard</a>
        <a href="/assessment" class="px-3 py-1.5 rounded-lg text-sm font-medium transition {% if active_page == 'assessment' %}bg-primary-50 dark:bg-primary-950/50 text-primary-700 dark:text-primary-400{% else %}text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800{% endif %}">Assessment</a>
        <a href="/compare" class="px-3 py-1.5 rounded-lg text-sm font-medium transition {% if active_page == 'compare' %}bg-primary-50 dark:bg-primary-950/50 text-primary-700 dark:text-primary-400{% else %}text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800{% endif %}">Compare</a>
      </nav>

      <!-- Right Controls: Theme Toggle + Auth -->
      <div class="flex items-center gap-3">
        <!-- Theme Toggle Button -->
        <button type="button" onclick="toggleTheme()" class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100/80 dark:bg-slate-800/80 text-slate-700 dark:text-slate-200 hover:border-primary-400 transition btn-3d" title="Toggle dark/light mode">
          <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="sun" class="w-4 h-4 block dark:hidden text-amber-500"></i>
        </button>

        <!-- Dynamic Auth Container -->
        <div id="navbar-auth-container">
          {% if user %}
            <div class="flex items-center gap-2">
              <a href="/dashboard" class="flex items-center gap-2 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/80 dark:bg-slate-800/80 text-xs sm:text-sm font-medium text-slate-800 dark:text-slate-200 hover:border-primary-400 transition btn-3d">
                <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-primary-500 to-indigo-600 text-white flex items-center justify-center text-xs font-semibold">
                  {{ user.name[0] | upper }}
                </div>
                <span class="hidden sm:inline font-semibold">{{ user.name }}</span>
                <span class="hidden lg:inline text-[10px] uppercase font-bold text-primary-600 dark:text-primary-400 bg-primary-100 dark:bg-primary-950 px-1.5 py-0.5 rounded-md">
                  Profile
                </span>
              </a>
              <button onclick="Storage.logout()" class="p-2 rounded-xl border border-rose-200/80 dark:border-rose-900/50 text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 text-xs sm:text-sm font-medium transition btn-3d" title="Log out">
                <i data-lucide="log-out" class="w-4 h-4"></i>
              </button>
            </div>
          {% else %}
            <div class="flex items-center gap-2">
              <a href="/login" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-200 hover:text-primary-600 dark:hover:text-primary-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition btn-3d">
                <i data-lucide="log-in" class="w-4 h-4"></i>
                <span>Login</span>
              </a>
              <a href="/register" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium bg-primary-600 hover:bg-primary-700 text-white shadow-md shadow-primary-500/25 transition btn-3d">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                <span>Register</span>
              </a>
            </div>
          {% endif %}
        </div>
      </div>
    </div>
  </header>

  <!-- Page Main Content Block -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-8 text-center text-xs text-slate-500 dark:text-slate-400">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <i data-lucide="compass" class="w-4 h-4 text-primary-600"></i>
        <span class="font-semibold text-slate-700 dark:text-slate-200">Smart Career Path</span>
        <span>• AI Career Intelligence Platform</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="/dashboard" class="hover:text-primary-600 dark:hover:text-primary-400 transition">Dashboard</a>
        <a href="/assessment" class="hover:text-primary-600 dark:hover:text-primary-400 transition">Assessment</a>
        <a href="/compare" class="hover:text-primary-600 dark:hover:text-primary-400 transition">Compare</a>
      </div>
    </div>
  </footer>

  <!-- Floating "Ask V" Widget -->
  <div class="fixed bottom-6 right-6 z-50">
    <!-- Chat Drawer -->
    <div id="ai-assistant-drawer" class="hidden flex-col w-[360px] sm:w-[420px] h-[520px] bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden mb-3 fade-in-up">
      <!-- Minimalist Header -->
      <div class="px-4 py-3 bg-slate-900 dark:bg-slate-950 text-white flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-primary-600 to-emerald-500 flex items-center justify-center font-bold text-xs text-white shadow-md">
            V
          </div>
          <div>
            <h3 class="font-semibold text-sm tracking-tight leading-tight">Ask V</h3>
            <span class="text-[10px] text-emerald-400 flex items-center gap-1 font-medium mt-0.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Online & Ready
            </span>
          </div>
        </div>
        <button type="button" onclick="toggleAssistant()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Messages Area -->
      <div id="assistant-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs sm:text-sm bg-slate-50/50 dark:bg-slate-950/40"></div>

      <!-- Quick Suggestion Chips -->
      <div class="px-3 py-2 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
        <button onclick="sendAssistantMessage('What technical skills are in highest market demand?')" class="text-[11px] whitespace-nowrap bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1 rounded-full text-slate-700 dark:text-slate-200 hover:border-primary-500 transition">Market Demand Skills</button>
        <button onclick="sendAssistantMessage('How should I structure my 30-60-90 day learning roadmap?')" class="text-[11px] whitespace-nowrap bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1 rounded-full text-slate-700 dark:text-slate-200 hover:border-primary-500 transition">Roadmap Strategy</button>
      </div>

      <!-- Input Bar -->
      <form id="assistant-form" class="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2">
        <input id="assistant-input" type="text" placeholder="Ask V about careers, skills, or salary..." class="flex-1 bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm outline-none border border-transparent focus:border-primary-500 transition" />
        <button type="submit" class="p-2 bg-primary-600 hover:bg-primary-700 text-white rounded-xl shadow-sm transition">
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>
      </form>
    </div>

    <!-- Floating Toggle Button (Branded as Ask V) -->
    <button type="button" onclick="toggleAssistant()" class="flex items-center gap-2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-4 py-2.5 rounded-full shadow-xl hover:bg-slate-800 dark:hover:bg-slate-100 transition-all font-semibold text-xs sm:text-sm border border-slate-700/50 dark:border-slate-200 btn-3d">
      <div class="w-5 h-5 rounded-full bg-gradient-to-tr from-primary-600 to-emerald-500 text-white flex items-center justify-center font-bold text-[10px]">
        V
      </div>
      <span>Ask V</span>
    </button>
  </div>

  <!-- Scripts -->
  <script src="/static/js/app.js"></script>
  <script src="/static/js/assistant.js"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
