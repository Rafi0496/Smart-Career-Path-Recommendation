{% extends "base.html" %}

{% block title %}Register | Smart Career Path{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12 fade-in-up">
  <div class="glass-panel rounded-3xl p-8 border border-slate-200/80 dark:border-slate-800 shadow-xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mx-auto mb-3 shadow-sm">
        <i data-lucide="user-plus" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">Create Your Account</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Unlock your personalized career dashboard and milestone progress tracking.</p>
    </div>

    <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Full Name</label>
        <input type="text" id="reg-name" required placeholder="Alex Morgan" class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary-500 transition" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Email Address</label>
        <input type="email" id="reg-email" required placeholder="alex@example.com" class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary-500 transition" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
        <input type="password" id="reg-password" required minlength="4" placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary-500 transition" />
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-3 rounded-xl shadow-md shadow-emerald-500/25 transition btn-3d mt-2">
        Register Account
      </button>

      <div class="text-center pt-4 border-t border-slate-100 dark:border-slate-800 text-xs text-slate-500">
        Already have an account?
        <a href="/login" class="text-primary-600 font-bold hover:underline ml-1">Sign In</a>
      </div>
    </form>
  </div>
</div>

<script>
async function handleRegister(e) {
  e.preventDefault();
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Registration failed");

    if (data.user) Storage.setUser(data.user);
    showToast("Account created successfully!", "success");
    window.location.href = "/assessment";
  } catch (err) {
    showToast(err.message, "error");
  }
}
</script>
{% endblock %}
