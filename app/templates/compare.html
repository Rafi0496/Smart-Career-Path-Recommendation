{% extends "base.html" %}

{% block title %}Compare Careers | Smart Career Path{% endblock %}

{% block content %}
<div class="py-6 space-y-8 fade-in-up">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white flex items-center gap-2.5">
        <i data-lucide="scale" class="w-6 h-6 text-primary-600"></i>
        <span>Side-by-Side Career Comparison</span>
      </h1>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
        Select up to 3 career tracks to compare market compensation, timelines, and overlapping skills.
      </p>
    </div>

    <!-- Career Selector Dropdown -->
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <select id="career-select" class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-semibold outline-none focus:border-primary-500">
        <option value="">-- Add Career to Compare --</option>
        {% for title in all_titles %}
        <option value="{{ title }}">{{ title }}</option>
        {% endfor %}
      </select>
      <button onclick="addSelectedCareer()" class="bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition btn-3d">
        Add
      </button>
      <button onclick="clearAll()" class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-500 hover:text-rose-500 transition" title="Clear all">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Comparison Grid Container -->
  <div id="comparison-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
</div>

<script>
let activeCompared = [];

async function loadCompareData() {
  activeCompared = Storage.getComparisonList();
  if (activeCompared.length === 0) {
    activeCompared = ["Full Stack Developer", "Data Scientist", "Cloud Architect"];
  }

  const container = document.getElementById('comparison-grid');
  container.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500 text-sm">Loading comparison details...</div>';

  try {
    const careerPromises = activeCompared.map(t =>
      fetch(`/api/careers/${encodeURIComponent(t)}`)
        .then(r => {
          if (!r.ok) throw new Error("Not found");
          return r.json();
        })
        .then(c => ({
          title: c.title,
          description: c.description,
          timeline: c.timeline,
          salaryRange: c.salaryRange,
          skills: c.skills || [],
          learningPath: c.learningPath || []
        }))
        .catch(() => null)
    );

    const careers = (await Promise.all(careerPromises)).filter(Boolean);

    if (careers.length === 0) {
      container.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500 text-sm">No careers selected. Use the selector above to add careers to compare.</div>';
      return;
    }

    container.innerHTML = careers.map(c => `
      <div class="glass-panel rounded-3xl p-6 border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col justify-between card-3d">
        <div class="space-y-4">
          <div class="flex items-start justify-between gap-2">
            <h3 class="text-xl font-bold text-slate-900 dark:text-white leading-tight">
              ${c.title}
            </h3>
            <button onclick="removeCareer('${c.title}')" class="text-slate-400 hover:text-rose-500 transition p-1" title="Remove">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed line-clamp-3">
            ${c.description}
          </p>

          <div class="space-y-2 text-xs pt-2 border-t border-slate-100 dark:border-slate-800">
            <div>
              <span class="font-bold text-slate-400 block text-[10px] uppercase">Timeline</span>
              <span class="font-semibold text-slate-800 dark:text-slate-200">${c.timeline}</span>
            </div>
            <div>
              <span class="font-bold text-slate-400 block text-[10px] uppercase">Compensation</span>
              <span class="font-semibold text-emerald-600 dark:text-emerald-400">${c.salaryRange}</span>
            </div>
            <div>
              <span class="font-bold text-slate-400 block text-[10px] uppercase">Milestone Stages</span>
              <span class="font-semibold text-slate-800 dark:text-slate-200">${c.learningPath.length} Structured Stages</span>
            </div>
          </div>

          <div class="pt-3 border-t border-slate-100 dark:border-slate-800">
            <span class="font-bold text-slate-400 block text-[10px] uppercase mb-2">Core Skills Matrix</span>
            <div class="flex flex-wrap gap-1.5">
              ${c.skills.slice(0, 6).map(s => `
                <span class="px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-[11px] font-medium border border-slate-200/80 dark:border-slate-700">
                  ${s}
                </span>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="pt-6 mt-4 border-t border-slate-100 dark:border-slate-800">
          <a href="/career-path?title=${encodeURIComponent(c.title)}" class="block w-full text-center bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs py-2.5 rounded-xl shadow-md shadow-primary-500/20 transition btn-3d">
            View Roadmap & Blueprint
          </a>
        </div>
      </div>
    `).join('');

    if (window.lucide) window.lucide.createIcons();
  } catch (err) {
    container.innerHTML = '<div class="col-span-full text-center py-12 text-rose-500 text-sm">Failed to load career data.</div>';
  }
}

function addSelectedCareer() {
  const sel = document.getElementById('career-select');
  const val = sel.value;
  if (!val) return;
  Storage.toggleComparison(val);
  loadCompareData();
}

function removeCareer(title) {
  Storage.toggleComparison(title);
  loadCompareData();
}

function clearAll() {
  Storage.clearComparison();
  loadCompareData();
}

document.addEventListener('DOMContentLoaded', loadCompareData);
</script>
{% endblock %}
