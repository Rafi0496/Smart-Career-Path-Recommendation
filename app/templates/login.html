{% extends "base.html" %}

{% block title %}Login | Smart Career Path{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12 fade-in-up">
  <div class="glass-panel rounded-3xl p-8 border border-slate-200/80 dark:border-slate-800 shadow-xl">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-primary-100 dark:bg-primary-950 text-primary-600 dark:text-primary-400 flex items-center justify-center mx-auto mb-3 shadow-sm">
        <i data-lucide="log-in" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white" id="auth-title">Sign In to Your Account</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1" id="auth-subtitle">Access your private dashboard, roadmaps, and career assessments.</p>
    </div>

    <!-- Alert for redirected users -->
    <div id="redirect-notice" class="hidden mb-4 p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900/60 text-xs text-amber-800 dark:text-amber-200 flex items-center gap-2">
      <i data-lucide="lock" class="w-4 h-4 shrink-0"></i>
      <span>Please log in or register to access that section.</span>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Email or Username</label>
        <input type="text" id="emailOrName" required placeholder="alex@example.com" class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary-500 transition" />
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">Password</label>
          <button type="button" onclick="showForgotMode()" class="text-xs text-primary-600 dark:text-primary-400 font-semibold hover:underline">Forgot Password?</button>
        </div>
        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary-500 transition" />
      </div>

      <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-bold text-sm py-3 rounded-xl shadow-md shadow-primary-500/25 transition btn-3d mt-2">
        Sign In
      </button>

      <div class="text-center pt-4 border-t border-slate-100 dark:border-slate-800 text-xs text-slate-500">
        Don't have an account?
        <a id="register-link" href="/register" class="text-primary-600 font-bold hover:underline ml-1">Create Account</a>
      </div>
    </form>

    <!-- Forgot Password Form (Hidden by default) -->
    <form id="forgot-form" onsubmit="handleRecovery(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Registered Email</label>
        <input type="email" id="rec-email" required placeholder="alex@example.com" class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary-500 transition" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Full Name on Profile</label>
        <input type="text" id="rec-name" required placeholder="Alex Morgan" class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary-500 transition" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">New Password</label>
        <input type="password" id="rec-new-password" required minlength="4" placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary-500 transition" />
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-3 rounded-xl shadow-md transition btn-3d mt-2">
        Reset & Update Password
      </button>

      <div class="text-center pt-4 border-t border-slate-100 dark:border-slate-800">
        <button type="button" onclick="showLoginMode()" class="text-xs text-slate-500 hover:text-primary-600 font-semibold">
          ← Back to Sign In
        </button>
      </div>
    </form>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const redirect = params.get('redirect');
  if (redirect) {
    const notice = document.getElementById('redirect-notice');
    if (notice) notice.classList.remove('hidden');
    const regLink = document.getElementById('register-link');
    if (regLink) regLink.href = `/register?redirect=${encodeURIComponent(redirect)}`;
  }
  if (window.lucide) window.lucide.createIcons();
});

function showForgotMode() {
  document.getElementById('login-form').classList.add('hidden');
  document.getElementById('forgot-form').classList.remove('hidden');
  document.getElementById('auth-title').textContent = "Account Recovery";
  document.getElementById('auth-subtitle').textContent = "Confirm identity to configure a new password.";
}

function showLoginMode() {
  document.getElementById('forgot-form').classList.add('hidden');
  document.getElementById('login-form').classList.remove('hidden');
  document.getElementById('auth-title').textContent = "Sign In to Your Account";
  document.getElementById('auth-subtitle').textContent = "Access your private dashboard and saved career blueprints.";
}

async function handleLogin(e) {
  e.preventDefault();
  const emailOrName = document.getElementById('emailOrName').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ emailOrName, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Invalid login credentials");

    if (data.user) Storage.setUser(data.user);
    showToast("Signed in successfully!", "success");
    
    const params = new URLSearchParams(window.location.search);
    const redirectUrl = params.get('redirect') || '/dashboard';
    window.location.href = redirectUrl;
  } catch (err) {
    showToast(err.message, "error");
  }
}

async function handleRecovery(e) {
  e.preventDefault();
  const email = document.getElementById('rec-email').value.trim();
  const name = document.getElementById('rec-name').value.trim();
  const newPassword = document.getElementById('rec-new-password').value;

  try {
    const res = await fetch('/api/auth/recover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, name, newPassword })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Recovery failed");

    showToast("Password updated! You can now sign in.", "success");
    showLoginMode();
  } catch (err) {
    showToast(err.message, "error");
  }
}
</script>
{% endblock %}
